[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slimeflow"
version = "0.3.0"
description = "AgentGuard: quarantine LLM agents on unconfirmed high-impact actions. Plus the Slime Flow swarm sim client."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Lauren Flipo", email = "flipperspectives@gmail.com"}]
keywords = ["llm", "agents", "guardrails", "quarantine", "swarm", "slime-mold", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
numpy = ["numpy>=1.21"]
async = ["httpx>=0.25"]
all = ["numpy>=1.21", "httpx>=0.25"]

[project.urls]
Homepage = "https://github.com/flipperspectives-crypto/slime-flow"
Repository = "https://github.com/flipperspectives-crypto/slime-flow"
Documentation = "https://github.com/flipperspectives-crypto/slime-flow/tree/main/python-sdk"

[tool.setuptools]
packages = ["slimeflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F"]
